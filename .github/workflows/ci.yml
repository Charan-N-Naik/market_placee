name: 🚀 KisanBazaar CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Frontend — Lint & Build (React + Vite)
  # ─────────────────────────────────────────────
  frontend-ci:
    name: 🖥️ Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔍 Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: 🏗️ Build frontend (production)
        working-directory: frontend
        run: npm run build

      - name: ✅ Frontend build succeeded
        run: echo "Frontend lint and build passed successfully!"

  # ─────────────────────────────────────────────
  # JOB 2: Node.js Backend — Install & Validate
  # ─────────────────────────────────────────────
  backend-node-ci:
    name: 🟢 Node.js Backend — Install & Validate
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/node/package-lock.json

      - name: 📦 Install Node.js backend dependencies
        working-directory: backend/node
        run: npm install

      - name: 🔍 Check for syntax errors
        working-directory: backend/node
        run: node --check server.js

      - name: ✅ Node.js backend check passed
        run: echo "Node.js backend installed and validated successfully!"

  # ─────────────────────────────────────────────
  # JOB 3: Python ML Service — Install & Validate
  # ─────────────────────────────────────────────
  backend-python-ci:
    name: 🐍 Python ML Service — Install & Validate
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/python/requirements.txt

      - name: 📦 Install Python dependencies
        working-directory: backend/python
        run: pip install -r requirements.txt

      - name: 🔍 Check Python syntax (app.py)
        working-directory: backend/python
        run: python -m py_compile app.py && echo "app.py syntax OK"

      - name: 🔍 Check Python syntax (ml_model.py)
        working-directory: backend/python
        run: python -m py_compile ml_model.py && echo "ml_model.py syntax OK"

      - name: ✅ Python ML service check passed
        run: echo "Python ML service installed and validated successfully!"

  # ─────────────────────────────────────────────
  # JOB 4: Final Status — All checks passed
  # ─────────────────────────────────────────────
  ci-success:
    name: ✅ All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-node-ci, backend-python-ci]

    steps:
      - name: 🎉 Pipeline complete
        run: |
          echo "================================================"
          echo "  ✅ KisanBazaar CI Pipeline Completed!"
          echo "  All 3 services passed checks on main branch."
          echo "================================================"
